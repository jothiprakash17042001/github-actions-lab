# 

name: Multi Branch CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Branch
        run: echo "Running on ${{ github.ref_name }}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t prakash227/calculator-app .

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    steps:
      - name: Development Deployment
        run: echo "Deploying to Development Environment"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Production Deployment
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker stop calculator || true
            docker rm calculator || true
            docker pull prakash227/calculator-app:latest
            docker run -d -p 80:5000 --name calculator prakash227/calculator-app:latest